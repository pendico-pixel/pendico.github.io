<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<h1>📗 Bharatiya Nagarik Suraksha Sanhita, 2023</h1>

<p>India's Criminal Procedure Code</p>
<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
}
header{
    background:linear-gradient(135deg,#0f7b43,#16a34a);
    color:white;
    padding:45px 20px;
    text-align:center;
    border-bottom-left-radius:30px;
    border-bottom-right-radius:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}
.container{
max-width:900px;
margin:auto;
padding:30px;
}
.card{
    background:#ffffff;
    padding:25px;
    margin-bottom:25px;
    border-radius:18px;
    box-shadow:0 12px 30px rgba(0,0,0,0.12);
    transition:all 0.3s ease;
}
.card:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 40px rgba(0,0,0,0.18);
}    
a{
color:#0f7b43;
text-decoration:none;
font-weight:bold;
}
footer{
background:#062b63;
color:white;
text-align:center;
padding:15px;
margin-top:30px;
}
</style>

</head>

<body>

<header class="hero">
    <div class="hero-content">
        <h1>🛡️ Bharatiya Nagarik Suraksha Sanhita, 2023</h1>
        <p>India's Criminal Procedure Code</p>

        <div class="stats">
            <div class="stat-card">
                <h2>39</h2>
                <span>Chapters</span>
            </div>

            <div class="stat-card">
                <h2>531</h2>
                <span>Sections</span>
            </div>

            <div class="stat-card">
                <h2>2023</h2>
                <span>Latest Act</span>
            </div>
        </div>
    </div>
</header>                                                                    
<div class="container">

<div class="card">
    <h2>🔎 Search BNSS Sections</h2>

    <input
        type="text"
        id="search"
        placeholder="Search by section, title or keyword..."
        onkeyup="searchSections()"
        style="width:100%;padding:15px;border-radius:10px;border:1px solid #ccc;font-size:16px;"
    >

    <br><br>

    <div id="results"></div>
</div>

</div>

<footer>
© 2026 Pendico
</footer>
<script>
let sections = [];

fetch(" data/bnss.json")
.then(response => response.json())
.then(data => {
    sections = data;
    displaySections(data);
});

function displaySections(data) {
    const results = document.getElementById("results");
    results.innerHTML = "";

    data.forEach(item => {
        results.innerHTML += `
        <div class="card" style="margin-top:20px;">
            <h3>📖 Section ${item.section} - ${item.title}</h3>

<p><strong>📂 Chapter:</strong> ${item.chapter}</p>

<p><strong>📝 Chapter Title:</strong> ${item.chapterTitle}</p>

<p>${item.explanation}</p>
        </div>
        `;
    });
}

function searchSections() {
    const keyword = document.getElementById("search").value.toLowerCase();

   const filtered = sections.filter(item =>
    item.section.toLowerCase().includes(keyword) ||
    item.title.toLowerCase().includes(keyword) ||
    item.chapter.toLowerCase().includes(keyword) ||
    item.chapterTitle.toLowerCase().includes(keyword) ||
    item.explanation.toLowerCase().includes(keyword)
); 

    displaySections(filtered);
}
</script>
</body>
</html>
