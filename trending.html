<script>

/* =====================================================
   VARIABLES
===================================================== */

let allTrends = [];

let currentCategory = "All";

let searchTerm = "";


/* =====================================================
   LOAD JSON
===================================================== */

async function loadTrending(){

    const feed =
    document.getElementById("feed");

    try{

        const response =
        await fetch("data/trending.json");

        if(!response.ok){

            throw new Error(
                "Unable to load trending.json"
            );

        }

        const data =
        await response.json();

        /*
         Supports either:

         {
             "trending": [...]
         }

         OR directly:

         [...]
        */

        if(Array.isArray(data)){

            allTrends = data;

        }

        else if(
            Array.isArray(data.trending)
        ){

            allTrends =
            data.trending;

        }

        else if(
            Array.isArray(data.items)
        ){

            allTrends =
            data.items;

        }

        else{

            throw new Error(
                "Invalid JSON structure"
            );

        }


        renderFeed();

    }

    catch(error){

        console.error(error);

        feed.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                ⚠️
            </div>

            <h3>
                Unable to load today's trends
            </h3>

            <p>
                Please check data/trending.json
                and try again.
            </p>

        </div>

        `;

        document.getElementById(
            "feedCount"
        ).textContent =
        "Error";

    }

}


/* =====================================================
   RENDER FEED
===================================================== */

function renderFeed(){

    const feed =
    document.getElementById("feed");

    let filtered =
    [...allTrends];


    /* CATEGORY */

    if(currentCategory !== "All"){

        filtered =
        filtered.filter(item =>

            String(
                item.category || ""
            ).toLowerCase()
            ===
            currentCategory.toLowerCase()

        );

    }


    /* SEARCH */

    if(searchTerm){

        filtered =
        filtered.filter(item => {

            const searchable = `

                ${item.title || ""}

                ${item.summary || ""}

                ${item.category || ""}

                ${(item.tags || []).join(" ")}

            `.toLowerCase();

            return searchable.includes(
                searchTerm
            );

        });

    }


    /* SORT */

    filtered.sort(
        (a,b) =>
        Number(a.rank || 999)
        -
        Number(b.rank || 999)
    );


    document.getElementById(
        "feedCount"
    ).textContent =

    filtered.length
    +
    (
        filtered.length === 1
        ? " trend"
        : " trends"
    );


    if(!filtered.length){

        feed.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                🔎
            </div>

            <h3>
                No trends found
            </h3>

            <p>
                Try another category or search term.
            </p>

        </div>

        `;

        return;

    }


    feed.innerHTML =
    filtered.map(
        (item,index) =>
        createCard(item,index)
    ).join("");

}


/* =====================================================
   CREATE CARD
===================================================== */

function createCard(item,index){

    const rank =
    item.rank || index + 1;

    const category =
    item.category || "India";

    const title =
    item.title ||
    "Trending Topic";

    const summary =
    item.summary ||
    "A trending development attracting attention.";

    const date =
    item.date ||
    "Today";

    const time =
    item.time ||
    "";

    const importance =
    String(
        item.importance ||
        "medium"
    ).toLowerCase();


    let meterWidth = 55;

    if(importance === "high"){
        meterWidth = 92;
    }

    if(importance === "low"){
        meterWidth = 35;
    }


    const tags =
    Array.isArray(item.tags)
    ? item.tags
    : [];


    const source =
    item.source || {};

    const sourceName =
    source.name ||
    "Source";

    const sourceUrl =
    source.url || "#";


    const safeTitle =
    escapeHtml(title);


    const safeSummary =
    escapeHtml(summary);


    return `

    <article
    class="trend-card"
    data-id="${rank}">


        <div class="card-top">


            <div class="rank">

                <span class="rank-number">
                    #${rank}
                </span>

                🔥 Trending

            </div>


            <div class="card-date">

                ${escapeHtml(date)}

                ${time
                    ? " • " + escapeHtml(time)
                    : ""
                }

            </div>


        </div>


        <div class="card-content">


            <div class="card-category">

                ${escapeHtml(category)}

            </div>


            <h2 class="card-title">

                ${safeTitle}

            </h2>


            <p class="card-summary">

                ${safeSummary}

            </p>


            <div class="trend-meter">

                <span class="meter-label">

                    TRENDING

                </span>

                <div class="meter">

                    <div
                    class="meter-fill"
                    style="
                    width:${meterWidth}%;
                    ">
                    </div>

                </div>

            </div>


            ${
                tags.length
                ?
                `

                <div class="tags">

                    ${
                        tags
                        .slice(0,6)
                        .map(tag =>

                            `<span class="tag">
                            #${escapeHtml(tag)}
                            </span>`

                        ).join("")
                    }

                </div>

                `
                :
                ""
            }


            <div class="source-line">

                Source:

                ${
                    sourceUrl !== "#"
                    ?
                    `<a
                    href="${escapeAttribute(sourceUrl)}"
                    target="_blank"
                    rel="noopener noreferrer">

                    ${escapeHtml(sourceName)}

                    </a>`
                    :
                    escapeHtml(sourceName)
                }

            </div>


        </div>


        <div class="card-actions">


            <div class="action-group">


                <button
                class="action like-button"
                onclick="toggleLike(this)">

                    ♡ Like

                </button>


                <button
                class="action bookmark-button"
                onclick="toggleBookmark(this)">

                    🔖 Save

                </button>


                <button
                class="action"
                onclick="shareTrend(
                    '${escapeAttribute(title)}'
                )">

                    ↗ Share

                </button>


            </div>


            <button
            class="read-button"
            onclick='openModal(${JSON.stringify(item)})'>

                Read More →

            </button>


        </div>


    </article>

    `;

}


/* =====================================================
   HTML ESCAPING
===================================================== */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function escapeAttribute(value){

    return String(value)
        .replace(/"/g,"%22")
        .replace(/'/g,"%27");

}

   CATEGORY FILTER

/* =====================================================
   LIKE
===================================================== */

function toggleLike(button){

    button.classList.toggle("liked");

    if(button.classList.contains("liked")){

        button.innerHTML =
        "♥ Liked";

    }

    else{

        button.innerHTML =
        "♡ Like";

    }

}


/* =====================================================
   BOOKMARK
===================================================== */

function toggleBookmark(button){

    button.classList.toggle(
        "bookmarked"
    );

    if(
        button.classList.contains(
            "bookmarked"
        )
    ){

        button.innerHTML =
        "🔖 Saved";

    }

    else{

        button.innerHTML =
        "🔖 Save";

    }

}


/* =====================================================
   SHARE
===================================================== */

async function shareTrend(title){

    const shareData = {

        title:
        title,

        text:
        title +
        " — Trending Today on Pendico",

        url:
        window.location.href

    };


    try{

        if(
            navigator.share
        ){

            await navigator.share(
                shareData
            );

        }

        else{

            await navigator.clipboard.writeText(
                window.location.href
            );

            alert(
                "Link copied!"
            );

        }

    }

    catch(error){

        console.log(
            "Share cancelled"
        );

    }

}


/* =====================================================
   MODAL
===================================================== */

function openModal(item){

    const modal =
    document.getElementById(
        "trendModal"
    );


    document.getElementById(
        "modalCategory"
    ).textContent =
    item.category || "India";


    document.getElementById(
        "modalTitle"
    ).textContent =
    item.title || "Trending Topic";


    document.getElementById(
        "modalSummary"
    ).textContent =
    item.summary ||
    "No additional summary available.";


    document.getElementById(
        "modalMeta"
    ).innerHTML = `

        <span>
            📅 ${escapeHtml(
                item.date || "Today"
            )}
        </span>

        <span>
            🔥 Rank #${escapeHtml(
                item.rank || "—"
            )}
        </span>

        <span>
            📍 ${escapeHtml(
                item.location || "India"
            )}
        </span>

    `;


    const tags =
    Array.isArray(item.tags)
    ? item.tags
    : [];


    document.getElementById(
        "modalTags"
    ).innerHTML =

    tags.map(tag =>

        `<span class="tag">
            #${escapeHtml(tag)}
        </span>`

    ).join("");


    const source =
    item.source || {};


    const sourceButton =
    document.getElementById(
        "modalSource"
    );


    if(source.url){

        sourceButton.href =
        source.url;

        sourceButton.style.display =
        "inline-block";

    }

    else{

        sourceButton.style.display =
        "none";

    }


    modal.classList.add(
        "show"
    );

    document.body.style.overflow =
    "hidden";

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

    document
    .getElementById(
        "trendModal"
    )
    .classList.remove(
        "show"
    );

    document.body.style.overflow =
    "";

}


document
.getElementById(
    "modalClose"
)
.addEventListener(
    "click",
    closeModal
);


document
.getElementById(
    "trendModal"
)
.addEventListener(
    "click",
    function(event){

        if(
            event.target === this
        ){

            closeModal();

        }

    }
);


document
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeModal();

        }

    }
);


/* =====================================================
   THEME
===================================================== */

const themeButton =
document.getElementById(
    "themeButton"
);


function updateTheme(){

    const light =
    localStorage.getItem(
        "pendico-theme"
    )
    ===
    "light";


    document.body
    .classList.toggle(
        "light",
        light
    );


    themeButton.textContent =
    light
    ? "🌙"
    : "☀️";

}


themeButton
.addEventListener(
    "click",
    function(){

        const isLight =
        document.body
        .classList
        .contains("light");


        localStorage.setItem(
            "pendico-theme",
            isLight
            ? "dark"
            : "light"
        );


        updateTheme();

    }
);


updateTheme();

   START

loadTrending();

</script>
