<script>

let allTrends = [];

let currentCategory = "All";

let currentSearch = "";


/* =====================================================
   LOAD JSON
===================================================== */

async function loadTrending(){

    const feed =
    document.getElementById("feed");

    const loading =
    document.getElementById("loading");

    try{

        const response =
        await fetch(
            "data/trending.json"
        );

        if(!response.ok){

            throw new Error(
                "Unable to load trending.json"
            );

        }

        const data =
        await response.json();

        /*
         * Supports either:
         *
         * { "trends": [...] }
         *
         * OR
         *
         * [...]
         */

        allTrends =
        Array.isArray(data)
        ? data
        : data.trends || [];

        loading.remove();

        renderFeed();

    }

    catch(error){

        console.error(error);

        loading.innerHTML = `

        <div style="
            font-size:40px;
            margin-bottom:10px;
        ">
        ⚠️
        </div>

        <strong>
        Unable to load today's trends.
        </strong>

        <p style="
            margin-top:7px;
            font-size:13px;
        ">
        Please check data/trending.json
        </p>

        `;

    }

}


/* =====================================================
   RENDER FEED
===================================================== */

function renderFeed(){

    const feed =
    document.getElementById("feed");

    const empty =
    document.getElementById("empty");

    feed.innerHTML = "";

    let filtered =
    allTrends.filter(item => {

        const categoryMatch =
        currentCategory === "All" ||
        String(item.category || "")
        .toLowerCase()
        ===
        currentCategory.toLowerCase();

        const searchText =
        (

            String(item.title || "") +
            " " +
            String(item.summary || "") +
            " " +
            String(item.category || "") +
            " " +
            (item.tags || []).join(" ")

        ).toLowerCase();

        const searchMatch =
        !currentSearch ||
        searchText.includes(
            currentSearch
        );

        return (
            categoryMatch &&
            searchMatch
        );

    });


    /*
     * Highest rank first
     */

    filtered.sort(
        (a,b) =>
        Number(a.rank || 999)
        -
        Number(b.rank || 999)
    );


    if(filtered.length === 0){

        empty.style.display =
        "block";

        return;

    }

    empty.style.display =
    "none";


    filtered.forEach(
        (item,index) => {

            feed.appendChild(
                createCard(
                    item,
                    index
                )
            );

        }
    );

}


/* =====================================================
   CREATE CARD
===================================================== */

function createCard(item,index){

    const card =
    document.createElement("article");

    card.className =
    "trend-card";


    const rank =
    item.rank ||
    index + 1;

    const category =
    item.category ||
    "India";


    const icon =
    getCategoryIcon(
        category
    );


    const tags =
    Array.isArray(item.tags)
    ? item.tags
    : [];


    const tagsHTML =
    tags.map(tag => `

        <span class="tag">
        #${escapeHTML(tag)}
        </span>

    `).join("");


    const imageHTML =
    item.image

    ?

    `

    <div class="card-image">

        <img
        src="${escapeAttribute(item.image)}"
        alt="${escapeAttribute(item.title || "Trending story")}"
        loading="lazy">

    </div>

    `

    :

    `

    <div class="card-image">

        <div class="image-placeholder">

        ${icon}

        </div>

    </div>

    `;


    const sourceName =
    item.source?.name ||
    "Pendico Trending";


    const date =
    item.date ||
    "Today";


    const time =
    item.time ||
    "";


    const url =
    item.source?.url ||
    item.url ||
    "";


    const readButton =
    url

    ?

    `

    <a
    class="read-button"
    href="${escapeAttribute(url)}"
    target="_blank"
    rel="noopener">

    Read source →

    </a>

    `

    :

    `

    <span
    class="read-button">

    Trending →

    </span>

    `;


    const score =
    item.score ||

    </div>


    ${imageHTML}


    <!-- CONTENT -->

        </span>

    <!-- TREND SCORE -->

/* =====================================================
   SHARE
===================================================== */

async function shareTrend(button){

    const card =
    button.closest(".trend-card");

    const title =
    card.querySelector(
        ".card-title"
    ).innerText;


    if(
        navigator.share
    ){

        try{

            await navigator.share({

                title:
                title,

                text:
                "Trending Today on Pendico",

                url:
                window.location.href

            });

        }

        catch(error){

            console.log(
                "Share cancelled"
            );

        }

    }

    else{

        try{

            await navigator.clipboard.writeText(
                window.location.href
            );

            button.innerText =
            "✓ Copied";

            setTimeout(
                () => {
                    button.innerText =
                    "↗ Share";
                },
                1500
            );

        }

        catch(error){

            alert(
                "Copy failed"
            );

        }

    }

}


/* =====================================================
   SAVE
===================================================== */

function saveTrend(button){

    button.classList.toggle(
        "saved"
    );

    if(
        button.classList.contains(
            "saved"
        )
    ){

        button.innerText =
        "🔖 Saved";

    }

    else{

        button.innerText =
        "🔖 Save";

    }

}


/* =====================================================
   DARK MODE
===================================================== */

function toggleDarkMode(){

    document.body.classList.toggle(
        "dark"
    );

    const dark =
    document.body.classList.contains(
        "dark"
    );

    localStorage.setItem(
        "pendicoDarkMode",
        dark
        ? "1"
        : "0"
    );

}


if(
    localStorage.getItem(
        "pendicoDarkMode"
    ) === "1"
){

    document.body.classList.add(
        "dark"
    );

}


/* =====================================================
   BACK TO TOP
===================================================== */

window.addEventListener(
    "scroll",
    function(){

        const button =
        document.getElementById(
            "backTop"
        );

        button.style.display =
        window.scrollY > 500
        ? "flex"
        : "none";

        button.style.alignItems =
        "center";

        button.style.justifyContent =
        "center";

    }
);


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHTML(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =====================================================
   START
===================================================== */

loadTrending();

</script>
