<script>

/* =========================================================
   GLOBAL DATA
========================================================= */

let sections = [];

let currentSection = null;

let currentIndex = -1;


/* =========================================================
   THEME
========================================================= */

function applyTheme(){

    const saved =
        localStorage.getItem("pendico-theme");

    if(saved === "dark"){

        document.body.classList.add("dark");

    }

    updateThemeButton();

}


function toggleTheme(){

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "pendico-theme",
        dark ? "dark" : "light"
    );

    updateThemeButton();

}


function updateThemeButton(){

    const button =
        document.getElementById("themeButton");

    if(!button) return;

    button.textContent =
        document.body.classList.contains("dark")
        ? "☀️"
        : "🌙";

}


/* =========================================================
   GET SECTION FROM URL
========================================================= */

function getRequestedSection(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("section");

}


/* =========================================================
   LOAD DATABASE
========================================================= */

async function loadBNS(){

    try{

        const response =
            await fetch("data/bns.json", {
                cache:"no-store"
            });

        if(!response.ok){

            throw new Error(
                "BNS JSON could not be loaded."
            );

        }

        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "BNS JSON format is invalid."
            );

        }


        sections = data;


        const requested =
            getRequestedSection();


        if(!requested){

            showError(
                "No Section Selected",
                "Please select a BNS section from the BNS library."
            );

            return;

        }


        const index =
            sections.findIndex(
                item =>
                String(item.section).trim() ===
                String(requested).trim()
            );


        if(index === -1){

            showError(
                "Section Not Found",
                `Section ${escapeHTML(requested)} could not be found in the BNS database.`
            );

            return;

        }


        currentIndex = index;

        currentSection =
            sections[index];


        renderSection();

    }
    catch(error){

        console.error(error);

        showError(
            "Unable to Load BNS",
            "The BNS database could not be loaded. Please check that data/bns.json exists and is accessible."
        );

    }

}

/* =========================================================
   SEARCH WITHIN SECTION
========================================================= */

function toggleFind(){

    const box =
        document.getElementById("findBox");

    if(!box) return;

    box.classList.toggle("active");

    if(box.classList.contains("active")){

        document
            .getElementById("findInput")
            .focus();

    }

}


function setupFind(){

    const input =
        document.getElementById("findInput");

    if(!input) return;


    input.addEventListener(
        "input",
        function(){

            const query =
                this.value.trim().toLowerCase();

            const text =
                currentSection.text || "";

            if(!query){

                document
                    .getElementById("findResult")
                    .textContent =
                    "0 matches";

                return;

            }


            const matches =
                text.toLowerCase()
                    .split(query)
                    .length - 1;


            document
                .getElementById("findResult")
                .textContent =
                `${matches} match${matches === 1 ? "" : "es"}`;

        }
    );

}


/* =========================================================
   COPY SECTION
========================================================= */

async function copySection(){

    if(!currentSection) return;


    const number =
        currentSection.section || "";

    const title =
        currentSection.title || "";

    const chapter =
        currentSection.chapterTitle ||
        currentSection.chapter ||
        "";

    const text =
        currentSection.text || "";

    const explanation =
        currentSection.explanation || "";


    const content =

`PENDICO
Bharatiya Nyaya Sanhita, 2023

Section ${number}
${title}

${chapter}

PROVISION
${text}

EXPLANATION
${explanation}

Source:
${window.location.href}`;


    try{

        await navigator.clipboard.writeText(
            content
        );

        showToast(
            "Section copied to clipboard ✓"
        );

    }
    catch(error){

        fallbackCopy(content);

    }

}


/* =========================================================
   FALLBACK COPY
========================================================= */

function fallbackCopy(text){

    const textarea =
        document.createElement("textarea");

    textarea.value = text;

    textarea.style.position =
        "fixed";

    textarea.style.opacity = "0";

    document.body.appendChild(
        textarea
    );

    textarea.select();

    try{

        document.execCommand("copy");

        showToast(
            "Section copied ✓"
        );

    }
    catch(error){

        showToast(
            "Unable to copy section"
        );

    }

    document.body.removeChild(
        textarea
    );

}


/* =========================================================
   SHARE
========================================================= */

async function shareSection(){

    if(!currentSection) return;


    const title =
        `BNS Section ${currentSection.section}`;

    const text =
        currentSection.title ||
        "Bharatiya Nyaya Sanhita, 2023";


    if(
        navigator.share
    ){

        try{

            await navigator.share({

                title:title,

                text:
                    `${title} — ${text}`,

                url:
                    window.location.href

            });

        }
        catch(error){

            /*
              User cancelled sharing.
            */

        }

        return;

    }


    try{

        await navigator.clipboard.writeText(
            window.location.href
        );

        showToast(
            "Section link copied ✓"
        );

    }
    catch(error){

        showToast(
            "Copy this page URL to share"
        );

    }

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const old =
        document.getElementById(
            "pendicoToast"
        );

    if(old){

        old.remove();

    }


    const toast =
        document.createElement("div");

    toast.id =
        "pendicoToast";


    toast.textContent =
        message;


    Object.assign(
        toast.style,
        {

            position:"fixed",

            bottom:"25px",

            left:"50%",

            transform:
                "translateX(-50%)",

            zIndex:"9999",

            background:
                "#071a35",

            color:"white",

            padding:
                "12px 18px",

            borderRadius:
                "12px",

            fontSize:"13px",

            fontWeight:"700",

            boxShadow:
                "0 10px 30px rgba(0,0,0,.25)",

            maxWidth:"90%",

            textAlign:"center"

        }
    );


    document.body.appendChild(
        toast
    );


    setTimeout(
        () => {

            toast.style.opacity =
                "0";

            toast.style.transition =
                ".3s";

            setTimeout(
                () => toast.remove(),
                300
            );

        },
        2200
    );

}

/* =========================================================
   SEO
========================================================= */

function updateSEO(
    number,
    title,
    text
){

    const description =
        `Section ${number} — ${title || "Bharatiya Nyaya Sanhita, 2023"}. Read the section and explanation on Pendico.`;

    let meta =
        document.querySelector(
            'meta[name="description"]'
        );


    if(!meta){

        meta =
            document.createElement("meta");

        meta.name =
            "description";

        document.head.appendChild(
            meta
        );

    }


    meta.content =
        description;


    setMetaProperty(
        "og:title",
        `Section ${number} - ${title || "BNS"} | Pendico`
    );

    setMetaProperty(
        "og:description",
        description
    );

    setMetaProperty(
        "og:url",
        window.location.href
    );

}


/* =========================================================
   META PROPERTY
========================================================= */

function setMetaProperty(
    property,
    content
){

    let meta =
        document.querySelector(
            `meta[property="${property}"]`
        );


    if(!meta){

        meta =
            document.createElement("meta");

        meta.setAttribute(
            "property",
            property
        );

        document.head.appendChild(
            meta
        );

    }


    meta.content =
        content;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        /*
          Don't trigger shortcuts
          while typing.
        */

        const tag =
            document.activeElement
                ?.tagName;

        if(
            tag === "INPUT" ||
            tag === "TEXTAREA"
        ){

            return;

        }


        if(
            event.key === "/"
        ){

            event.preventDefault();

            toggleFind();

        }


        if(
            event.key === "ArrowLeft" &&
            currentIndex > 0
        ){

            const previous =
                sections[
                    currentIndex - 1
                ];

            window.location.href =
                `section.html?section=${encodeURIComponent(previous.section)}`;

        }


        if(
            event.key === "ArrowRight" &&
            currentIndex <
            sections.length - 1
        ){

            const next =
                sections[
                    currentIndex + 1
                ];

            window.location.href =
                `section.html?section=${encodeURIComponent(next.section)}`;

        }

    }
);

   START APPLICATION

applyTheme();

loadBNS();
