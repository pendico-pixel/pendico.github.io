<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendico - Section Details</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f7fb;
}

header{
background:#0b3d91;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

h2{
color:#0b3d91;
}

.back{
display:inline-block;
margin-top:20px;
padding:10px 18px;
background:#0b3d91;
color:white;
text-decoration:none;
border-radius:8px;
}

footer{
margin-top:40px;
background:#062b63;
color:white;
text-align:center;
padding:15px;
}
</style>

</head>

<body>

<header>
<h1>📘 Pendico</h1>
<p>Section Details</p>
</header>

<div class="container">

<div class="card">

<h2 id="sectionTitle">Loading...</h2>

<p id="sectionText">Loading section...</p>

<hr>

<h3>💡 Explanation</h3>

<p id="sectionExplanation">
Explanation will be added soon.
</p>

<a class="back" href="../acts/bns.html">⬅ Back to BNS</a>

</div>

</div>

<footer>
© 2026 Pendico
</footer>
<script>
const params = new URLSearchParams(window.location.search);
const sectionNo = params.get("section");

fetch("../data/bns.json")
.then(response => response.json())
.then(data => {

const item = data.find(sec => sec.section === sectionNo);

if(item){

document.getElementById("sectionTitle").innerText =
"Section " + item.section + " - " + item.title;

document.getElementById("sectionText").innerText =
item.text || "Section text will be added soon.";

document.getElementById("sectionExplanation").innerText =
item.explanation || "Explanation will be added soon.";

}else{

document.getElementById("sectionTitle").innerText = "Section Not Found";

}

})
.catch(error => {
document.getElementById("sectionTitle").innerText = "Error loading data";
console.error(error);
});
</script>
</body>
</html>
